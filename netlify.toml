[build]
  publish = "public"

[[redirects]]
  from = "/coaching-home"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-XTqURPyFx8e77fci83N/7Z5d9BO3ubFj3fZgFMGhzqo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://calendly.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/coaching-home/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-home/index.html"
  to = "/"
  status = 301
  force = true

# Permanent rule: thin topic filters remain excluded after the domain cutover.
[[headers]]
  for = "/coaching-blog/tag/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
