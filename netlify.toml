[build]
  publish = "public"

[[redirects]]
  from = "/coaching-home"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/coaching-home/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-home/index.html"
  to = "/"
  status = 301
  force = true

# Permanent rule: thin topic filters remain excluded after the domain cutover.
[[headers]]
  for = "/coaching-blog/tag/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
